<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu
      contentId="main-content"
      type="overlay"
    >
      <ion-header>
        <ion-toolbar>
          <ion-title>Menu</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          @for (p of appPages; track p) {
            <ion-menu-toggle
              auto-hide="false"
            >
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet
      id="main-content"
    ></ion-router-outlet>
  </ion-split-pane>
</ion-app>
